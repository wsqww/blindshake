<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 摇摇瞎选 · 小程序头像(老虎机版)
       核心隐喻:老虎机(随机定格)+ 卷轴问号(瞎选/未知结果)+ 拉杆与粒子(摇一摇)
       色彩:蓝色渐变背景 + 白色机身,窗口内卷轴「滚动中」与首页老虎机动画呼应 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45A6FF"/>
      <stop offset="1" stop-color="#1E63E9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0A2E7A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win">
      <rect x="360" y="420" width="300" height="240" rx="36"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- 粒子:摇一摇的动感残影 -->
  <circle cx="228" cy="242" r="26" fill="#3ED2B4"/>
  <circle cx="806" cy="286" r="18" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="788" cy="782" r="22" fill="#3ED2B4" opacity="0.9"/>
  <circle cx="238" cy="768" r="14" fill="#FFFFFF" opacity="0.6"/>

  <!-- 老虎机主体:微倾,含机身、卷轴窗、跑马灯、拉杆 -->
  <g transform="rotate(-8 512 512)">
    <!-- 底座厚度 + 机身 -->
    <g filter="url(#shadow)">
      <rect x="300" y="330" width="420" height="470" rx="88" fill="#164FC9"/>
      <rect x="300" y="310" width="420" height="470" rx="88" fill="url(#face)"/>
    </g>

    <!-- 顶部跑马灯 -->
    <circle cx="430" cy="374" r="16" fill="#3ED2B4"/>
    <circle cx="510" cy="374" r="16" fill="#9CD0FF"/>
    <circle cx="590" cy="374" r="16" fill="#3ED2B4"/>

    <!-- 显示窗:卷轴滚动中,中间定格 ?,上下为被裁切的相邻符号 -->
    <rect x="360" y="420" width="300" height="240" rx="36" fill="#1E63E9"/>
    <g clip-path="url(#win)" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-weight="700" text-anchor="middle">
      <text x="510" y="460" font-size="130" fill="#FFFFFF" opacity="0.45">★</text>
      <text x="510" y="595" font-size="180" fill="#FFFFFF">?</text>
      <text x="510" y="730" font-size="130" fill="#FFFFFF" opacity="0.45">7</text>
    </g>

    <!-- 出奖口 -->
    <rect x="400" y="700" width="220" height="40" rx="20" fill="#DCE9FF"/>

    <!-- 拉杆:横轴 + 竖杆 + 球头 -->
    <rect x="714" y="560" width="96" height="26" rx="13" fill="#164FC9"/>
    <rect x="774" y="420" width="26" height="152" rx="13" fill="#164FC9"/>
    <circle cx="787" cy="398" r="36" fill="#3ED2B4"/>
  </g>
</svg>
